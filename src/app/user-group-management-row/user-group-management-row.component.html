<div class="users-section">
  <span style="width: 20%">{{user.username}}</span>
  <div style="width: 40%">
    <select [(ngModel)]="addGroupSelected">
      <option *ngFor="let group of occludeGroups(allGroups, user)" [value]="group.id">
        {{group.groupName}}
      </option>
    </select>
    <input type="button" value="add" (click)="doUserAdd(user, addGroupSelected)">
  </div>
  <div style="width:40%">
    <select [(ngModel)]="removeGroupSelected">
      <option *ngFor="let group of user.groupMembership" [value]="group.id">
        {{group.groupName}}
      </option>
    </select>
    <input type="button" value="remove" (click)="doUserRemove(user, removeGroupSelected)">
  </div>
</div>
